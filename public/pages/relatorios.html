<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>KhonFácil — Relatórios</title>
  <link rel="icon" type="image/x-icon" href="../assets/img/favicon.ico">
  <link rel="apple-touch-icon" href="../assets/img/favicon.png">
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:FILL@0..1" rel="stylesheet">
  <link rel="stylesheet" href="../assets/css/styles.css" />
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.5.1/dist/chart.umd.min.js"></script>
</head>
<body>
  <div class="app-shell">
    <aside class="sidebar" id="sidebar"></aside>
    <div class="main-area">
      <header class="topbar" id="topbar"></header>
      <main class="content">

    <section class="page-grid">
      <section class="panel">
        <div class="panel-header">
          <div>
            <h2>Relatórios regionalizados</h2>
            <p class="muted">Filtros por região e status. Exportação reflete os filtros e inclui data no cabeçalho.</p>
          </div>
          <span class="badge info">RF04 • RN09</span>
        </div>

        <div class="form-grid">
          <div><label>Região</label><select id="filtroRegiao"></select></div>
          <div><label>Status</label><select id="filtroStatus"><option value="todos">Todos</option><option>EM ABERTO</option><option>AJUIZADO</option><option>ADIMPLENTE</option><option>ACORDO FIRMADO</option></select></div>
        </div>

        <div class="actions">
          <button class="btn primary" onclick="exportCSV()">Exportar Excel/CSV</button>
          <button class="btn secondary" onclick="window.print()">Exportar PDF/Imprimir</button>
        </div>
        <p class="muted" style="margin-top:12px">Data de geração: <strong id="reportDate"></strong></p>
      </section>

      <div class="kpi-grid" id="reportSummary"></div>

      <section class="panel">
        <div class="table-wrap">
          <table>
            <thead><tr><th>Cliente</th><th>Região</th><th>Grupo/Cota</th><th>Saldo</th><th>Status</th><th>Risco</th><th>Vencimento</th></tr></thead>
            <tbody id="relatorioTable"></tbody>
          </table>
        </div>
      </section>
    </section>

      </main>
      <div class="footer-note">KhonFácil • MVP acadêmico • HTML, CSS, JavaScript e LocalStorage</div>
    </div>
  </div>

  <script src="../assets/js/mockData.js"></script>
  <script src="../assets/js/storage.js"></script>
  <script src="../assets/js/app.js"></script>
  <script src="../assets/js/chatWidget.js"></script>
  <script src="../assets/js/admin.js"></script>
  <script>
    initApp("relatorios", ["admin"]);
    initRelatorios();
  </script>
</body>
</html>
