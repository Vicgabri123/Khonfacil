<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>KhonFácil — Parcelas</title>
  <link rel="icon" type="image/x-icon" href="../assets/img/favicon.ico">
  <link rel="apple-touch-icon" href="../assets/img/favicon.png">
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:FILL@0..1" rel="stylesheet">
  <link rel="stylesheet" href="../assets/css/styles.css" />
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.5.1/dist/chart.umd.min.js"></script>
</head>
<body>
  <div class="app-shell">
    <aside class="sidebar" id="sidebar"></aside>
    <div class="main-area">
      <header class="topbar" id="topbar"></header>
      <main class="content">

    <section class="panel">
      <div class="panel-header">
        <div>
          <h2>Minhas parcelas e cotas</h2>
          <p class="muted">O consorciado visualiza somente os próprios dados, respeitando isolamento por perfil.</p>
        </div>
        <span class="badge info">RN05</span>
      </div>

      <div class="table-wrap">
        <table>
          <thead><tr><th>Grupo/Cota</th><th>Saldo</th><th>Parcelas atrasadas</th><th>Vencimento</th><th>Status</th><th>Risco</th><th>Ação</th></tr></thead>
          <tbody id="parcelasTable"></tbody>
        </table>
      </div>
    </section>

      </main>
      <div class="footer-note">KhonFácil • MVP acadêmico • HTML, CSS, JavaScript e LocalStorage</div>
    </div>
  </div>

  <script src="../assets/js/mockData.js"></script>
  <script src="../assets/js/storage.js"></script>
  <script src="../assets/js/app.js"></script>
  <script src="../assets/js/chatWidget.js"></script>
  <script src="../assets/js/cliente.js"></script>
  <script>
    initApp("parcelas", ["cliente"]);
    initParcelas();
  </script>
</body>
</html>
